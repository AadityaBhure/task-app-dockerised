version: "3.9"

services:
  backend:
    build: ./backend
    container_name: task-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: task-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
